---
- name: Créer l'utilisateur node_exporter
  ansible.builtin.user:
    name: node_exporter
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Déterminer l'architecture
  ansible.builtin.set_fact:
    ne_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Télécharger et extraire node_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-{{ ne_arch }}.tar.gz"
    dest: /tmp
    remote_src: true

- name: Installer le binaire
  ansible.builtin.copy:
    src: "/tmp/node_exporter-1.8.2.linux-{{ ne_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: true
    owner: node_exporter
    group: node_exporter

- name: Installer le service systemd
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"

- name: Activer et démarrer node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
